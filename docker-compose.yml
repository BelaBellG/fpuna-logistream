services:

  # ==========================================================
  # KAFKA
  # ==========================================================

  kafka:
    image: apache/kafka:4.0.1
    container_name: logistream-kafka

    ports:
      - "9094:9094"

    environment:

      # Identidad del broker
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Listeners
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093

      # Direcciones anunciadas
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094

      # Comunicación entre brokers
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Protocolos
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      # Listener del controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Quorum KRaft
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Configuración para un solo broker
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Tres particiones
      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka_data:/var/lib/kafka/data


  # ==========================================================
  # APACHE BEAM - EXPANSION SERVICE
  # ==========================================================

  expansion:
    image: apache/beam_java_expansion_service:2.69.0

    container_name: logistream-expansion

    command:
      - "--id=logistream-expansion"
      - "--port=45193"

    ports:
      - "45193:45193"


  # ==========================================================
  # APACHE BEAM - PIPELINE PYTHON
  # ==========================================================

  beam:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: logistream-beam

    depends_on:
      - kafka
      - expansion

    network_mode: "service:expansion"

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EXPANSION_SERVICE: 127.0.0.1:45193
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    volumes:
      - ./pipeline:/app/pipeline
      - ./tests:/app/tests
      - /var/run/docker.sock:/var/run/docker.sock

    command:
      [
        "python",
        "pipeline/pipeline.py"
      ]


# ==========================================================
# VOLUMEN
# ==========================================================

volumes:
  kafka_data: